# Ambiente completo do monorepo: Postgres, RabbitMQ e os tres servicos.
# Para subir somente a infraestrutura: docker compose up -d postgres rabbitmq
#
# Uso completo: cp .env.example .env && docker compose up -d --build --wait

name: hospital-fase3

services:

  postgres:
    image: postgres:16
    container_name: hospital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Executado apenas quando o volume esta vazio. Ver docker/postgres/init.sql.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hospital-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hospital-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - hospital-net

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: hospital-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - hospital-net

  agendamento:
    build:
      context: .
      dockerfile: agendamento-service/Dockerfile
    container_name: hospital-agendamento
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      AGENDAMENTO_DB_URL: jdbc:postgresql://postgres:5432/agendamento_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      SPRING_PROFILES_ACTIVE: demo,docker
    ports:
      - "8081:8081"
    networks:
      - hospital-net

  notificacao:
    build:
      context: .
      dockerfile: notificacao-service/Dockerfile
    container_name: hospital-notificacao
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      NOTIFICACAO_DB_URL: jdbc:postgresql://postgres:5432/notificacao_db
      NOTIFICACAO_DB_USER: ${POSTGRES_USER}
      NOTIFICACAO_DB_PASSWORD: ${POSTGRES_PASSWORD}
      NOTIFICACAO_SENDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MANAGEMENT_HEALTH_MAIL_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      SPRING_PROFILES_ACTIVE: demo,docker
    ports:
      - "8082:8082"
    networks:
      - hospital-net

  historico:
    build:
      context: .
      dockerfile: historico-service/Dockerfile
    container_name: hospital-historico
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      HISTORICO_DB_URL: jdbc:postgresql://postgres:5432/historico_db
      HISTORICO_DB_USER: ${POSTGRES_USER}
      HISTORICO_DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      SPRING_PROFILES_ACTIVE: demo,docker
    ports:
      - "8083:8083"
    networks:
      - hospital-net

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  hospital-net:
    driver: bridge

schema: spec-driven

# Injetado em TODA requisição de planejamento do OpenSpec.
# Mantenha enxuto: o que o agente precisa saber sempre, não a documentação inteira.
# Detalhamento vive em docs/ — os ponteiros estão no fim desta seção.
context: |
  PROJETO
  Backend hospitalar de agendamento e histórico de consultas. Tech Challenge da
  Fase 3 da Pós Tech FIAP em Arquitetura e Desenvolvimento Java. O que é avaliado:
  segurança com Spring Security e níveis de acesso, consulta flexível de histórico
  via GraphQL, e comunicação assíncrona entre serviços via RabbitMQ.
  Três perfis de usuário: MEDICO, ENFERMEIRO, PACIENTE.

  STACK
  Java 21 · Spring Boot 3.5.x · Maven multi-módulo com ${revision}
  PostgreSQL 16 + JPA + Flyway (um database por serviço)
  RabbitMQ 3.13 + Spring AMQP · Spring Security 6 + JWT HS256 · Spring for GraphQL
  Testcontainers · JUnit 5 · ArchUnit · JaCoCo · Docker Compose

  MÓDULOS
  shared-contracts    — envelope de eventos, payloads, topologia RabbitMQ
  shared-security     — filtro JWT, JwtService, config base do Spring Security
  agendamento-service :8081 — escrita, REST, autenticação, Clean Architecture, Outbox
  notificacao-service :8082 — consome eventos, confirmações e lembrete D-1
  historico-service   :8083 — projeta eventos em read model, expõe GraphQL

  CAPABILITIES (organizam openspec/specs/)
  autenticacao-e-autorizacao · agendamento-de-consultas · mensageria-de-eventos
  notificacoes-ao-paciente · historico-de-consultas · operacao-do-ambiente

  CONVENÇÕES DE CÓDIGO
  Pacote raiz br.com.fiap.hospital.
  Clean Architecture APENAS no agendamento-service: domain sem Spring/JPA/Jackson/
  Validation; application com um caso de uso por classe e um método público;
  infrastructure com todos os adaptadores. Verificado por ArchUnit.
  Notificação e histórico usam camadas simples — são adaptadores de evento.
  Records para DTOs. Mapeamento domínio↔entidade manual, sem MapStruct.
  Clock injetado sempre. Nunca LocalDateTime.now() direto.
  Erros HTTP em RFC 7807 ProblemDetail com correlationId e timestamp.
  Schema só muda por migration Flyway. Nunca ddl-auto: update.
  Mensagens de validação e de erro em português.

  CONVENÇÕES DE TESTE
  Teste unitário em *Test.java (surefire); integração em *IT.java (failsafe).
  Infraestrutura em teste é real via Testcontainers. Não mockar broker nem banco.
  Cobertura mínima 85% global; 90% em domain e application do agendamento.
  Cada célula da matriz de autorização tem um teste de integração próprio.

  GIT — LIMITE DE ATUAÇÃO
  O agente NUNCA executa git commit, git push, git merge, git tag, git branch nem
  abre pull request. Essas operações são exclusivamente do Gabriel.
  O agente edita arquivos e, ao terminar, ENTREGA os comandos git prontos para ele
  copiar, com as mensagens de commit já redigidas. Se um passo exigir que algo
  esteja commitado para prosseguir, o agente para e pede.
  As mensagens de commit NAO levam rodape de coautoria nem assinatura de agente:
  nada de Co-Authored-By, nada de "Generated with". Os commits sao do Gabriel, que
  os revisa e assina. Vale mesmo que a ferramenta do agente instrua o contrario.
  GitFlow completo: feature/<mXX>-<change-id> → develop → release/<versao> → main.
  Merges sempre --no-ff. Conventional Commits em português.
  Escopos: agendamento, notificacao, historico, contracts, security, infra, docs, openspec.

  ECONOMIA DE CONTEXTO
  O relatorio final de cada etapa vai para o gestor por copia manual, entao ele custa
  caro. Formato obrigatorio, no maximo 25 linhas:
  1. Estado: X/Y tasks, resultado do mvn verify, cobertura.
  2. Decisoes que voce tomou sozinho, e apenas as que desviam da spec, do roadmap ou
     de uma instrucao explicita. Uma linha cada.
  3. Perguntas bloqueantes. Se nao houver, escreva "nenhuma".
  4. Comandos git.
  NAO reproduza o conteudo dos artefatos que acabou de escrever, NAO liste tarefa por
  tarefa, NAO repita tabelas de criterios de aceite nem o resumo do que cada arquivo
  contem. O gestor le os arquivos no repositorio; repetir o conteudo no chat e gasto
  puro. Narracao durante o trabalho tambem deve ser curta.

  REGRAS DE EXECUÇÃO
  Se a spec nao cobrir uma decisao necessaria, PARE e pergunte. Nao improvise requisito.
  Nao adiante escopo de changes futuras do roadmap.
  Arquive na propria feature branch, depois da aprovacao do PR e antes do merge, para
  que spec e codigo entrem em develop no mesmo merge. A change vai para
  openspec/changes/archive/<change-id>/.

  RELATORIO AO GABRIEL — SEJA BREVE
  Tokens sao recurso escasso neste projeto. O relatorio no chat NAO repete o que
  ja esta nos artefatos: proposal, design, spec e tasks sao lidos direto do
  repositorio por quem revisa. Nao narre raciocinio, tentativas, comandos
  intermediarios, nem monte tabelas que duplicam o conteudo dos artefatos.
  Justificativa tecnica vive no design.md; no chat, cite o arquivo.
  Formato fixo do relatorio, nesta ordem, sem preambulo:
    STATUS   — change, X/Y tasks, build, numero de testes, cobertura
    DESVIOS  — o que saiu da proposta aprovada e por que, ou "nenhum"
    DECISOES — o que precisa do Gabriel para prosseguir, ou "nenhuma"
    RISCO    — o que voce faria diferente ou o que ficou fragil, ou "nenhum"
    VERIFICACAO — cada criterio de aceite com UMA linha de evidencia
    GIT      — os comandos, sem explicacao
  Alvo: 40 linhas. Se passar disso, corte explicacao, nao conteudo.
  Quando parar para perguntar, mande SO a pergunta e as opcoes — nada mais.

  PAPEL DE ENGENHEIRO DE SOFTWARE
  Quem implementa e' a ferramenta de IA em uso, hoje o CODEX. Os changes M00 a M04
  foram implementados pelo Claude Code; mencoes nominais nos documentos se referem
  ao papel, nao ao produto.
  Nao ha mais revisor automatico independente nos PRs: o Codex, que exercia esse
  papel, passou a implementar. A verificacao recai sobre a auditoria do gestor e
  sobre as coberturas estruturais do projeto. Trate qualquer omissao que uma dessas
  coberturas poderia pegar como defeito seu, nao como algo que a revisao apanha depois.

  RESTRIÇÕES
  Sem frontend. Sem provedor real de SMS/e-mail (porta com adaptador log e SMTP/Mailpit).
  Sem deploy em nuvem — docker compose up é o ambiente de entrega.
  Sem prontuário eletrônico, prescrição ou faturamento.

  DOCUMENTAÇÃO DE REFERÊNCIA
  docs/01-arquitetura.md         — arquitetura, Clean Architecture, segurança, erros
  docs/02-especificacao-funcional.md — RF/RNF, matriz de autorização, modelo de dados
  docs/03-contrato-de-eventos.md — NORMATIVO: topologia, envelope, outbox, idempotência
  docs/04-roadmap.md             — as 15 changes, com notas técnicas obrigatórias
  docs/05-fluxo-de-trabalho.md   — ciclo OpenSpec + GitFlow, releases, DoD

rules:
  proposal:
    - O change-id vem de docs/04-roadmap.md. Não invente um novo.
    - Toda proposta declara a capability afetada, os requisitos RF/RNF que fecha e a release alvo.
    - Uma proposta cobre uma change do roadmap. Escopo que não está na proposta é outra change.
    - Declare explicitamente o que NÃO muda nesta change.

  design:
    - As "notas técnicas obrigatórias" do change em docs/04-roadmap.md precisam aparecer aqui, decididas e justificadas. Se faltar alguma, o design está incompleto.
    - Registre as alternativas consideradas e por que foram descartadas — vira insumo dos ADRs.
    - Liste os riscos com a mitigação correspondente.

  specs:
    - Formato Requirement + Scenario com WHEN/THEN. Um Scenario descreve comportamento observável, nunca implementação.
    - Todo Scenario precisa ser rastreável a pelo menos um teste automatizado.
    - Casos negativos (401, 403, 409, 422) são Scenarios de primeira classe, não notas de rodapé.
    - Deltas usam ADDED, MODIFIED ou REMOVED Requirements. Não reescreva a capability inteira.

  tasks:
    - Agrupe por área (build, domínio, persistência, API, testes, documentação) e numere.
    - A última seção é sempre de verificação, com os comandos concretos que provam a entrega.
    - Documentação afetada (README, ADR, collection Postman) entra como task, não como pós-trabalho.

# Nota: o schema spec-driven aceita apenas os artifact IDs design, proposal, specs e tasks
# em `rules`. Regras de execucao vivem no bloco REGRAS DE EXECUCAO do `context:` acima,
# que e injetado em toda requisicao de planejamento.
